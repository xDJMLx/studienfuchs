<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1b28" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studienfuchs" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Studienfuchs: kurze Lektionen, Wiederholung nach Plan und eigene Vokabeln aus dem Schulbuch." />
    <script>
      // Dark-Mode vor dem ersten Rendern setzen, damit nichts aufblitzt
      try {
        var t = (JSON.parse(localStorage.getItem("studienfuchs-v1") || localStorage.getItem("lernfuchs-v1")) || {}).state || {};
        var dark = (t.theme || "dark") === "dark" || ((t.theme || "dark") === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>Studienfuchs – Lernen für die Schule</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
