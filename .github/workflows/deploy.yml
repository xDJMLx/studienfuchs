name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      # Zum Vergleich: das vorige Design (Tag design-v2) unter /alt/. Fällt der Bau aus, geht die normale Seite trotzdem online.
      - name: Altes Design unter /alt/ bauen
        continue-on-error: true
        run: |
          git fetch --depth=1 --no-tags origin refs/tags/design-v2:refs/tags/design-v2
          git worktree add ../alt design-v2
          cd ../alt
          npm ci --no-audit --no-fund
          VITE_BASE=/${{ github.event.repository.name }}/alt/ npm run build
          cp -r dist "$GITHUB_WORKSPACE/dist/alt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
